<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meblio - площадка для заказчиков и производителей мебели</title>
    <meta
      name="description"
      content="Meblio - рабочая площадка для общения заказчиков мебели и мебельных производств: заказы, отклики, личные кабинеты и чат."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/meblio.png" type="image/png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#c05621">
    <link rel="apple-touch-icon" href="/meblio.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <button class="logo as-button" type="button" data-view="home" aria-label="Meblio">
          <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" role="img" focusable="false">
              <rect class="logo-mark-bg" x="2" y="2" width="44" height="44" rx="11"></rect>
              <path class="logo-panel-left" d="M11 34V14h8l5 9 5-9h8v20h-7V23l-6 10-6-10v11z"></path>
              <path class="logo-panel-line" d="M16 14h4l4 8 4-8h4"></path>
              <circle class="logo-handle" cx="36" cy="13" r="3"></circle>
            </svg>
          </span>
          <span class="logo-word">Meblio</span>
        </button>
        <nav class="nav" aria-label="Навигация">
          <button type="button" data-view="home">Главная</button>
          <button type="button" data-view="market">Заказы</button>
          <button type="button" data-view="companies">Компании</button>
          <button type="button" data-view="services">Услуги</button>
          <button type="button" data-view="articles">Статьи</button>
          <button type="button" data-view="dashboard">Кабинет</button>
        </nav>
        <div class="header-actions" id="headerActions"></div>
        <button class="burger" id="burgerBtn" type="button" aria-label="Меню" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <div class="drawer-overlay" id="drawerOverlay"></div>
    <aside class="mobile-drawer" id="mobileDrawer" aria-hidden="true">
      <nav class="drawer-nav" aria-label="Мобильная навигация">
        <button type="button" data-view="home">Главная</button>
        <button type="button" data-view="market">Заказы</button>
        <button type="button" data-view="companies">Компании</button>
        <button type="button" data-view="services">Услуги</button>
        <button type="button" data-view="articles">Статьи</button>
        <button type="button" data-view="dashboard">Кабинет</button>
      </nav>
      <div class="drawer-auth" id="drawerAuth"></div>
    </aside>

    <main id="app"></main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <div>
          <span class="footer-logo">Meblio</span>
          <p class="muted" style="margin:8px 0 0;max-width:280px">B2B-площадка для заказчиков мебели и мебельных производств. mebl.io</p>
        </div>
        <div>
          <h4>Продукт</h4>
          <a href="/market" data-nav>Заказы</a>
          <a href="/companies" data-nav>Компании</a>
          <a href="/services" data-nav>Услуги</a>
        </div>
        <div>
          <h4>Знания</h4>
          <a href="/articles" data-nav>Статьи</a>
        </div>
      </div>
      <div class="container footer-bottom">© 2026 Meblio · mebl.io</div>
    </footer>

    <div class="modal" id="authModal" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal></div>
      <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <button class="modal-close" type="button" data-close-modal aria-label="Закрыть">x</button>
        <p class="eyebrow">Вход на площадку</p>
        <h2 id="authTitle">Создайте кабинет или войдите</h2>
        <div class="tabs" role="tablist">
          <button class="tab is-active" type="button" data-auth-tab="login">Вход</button>
          <button class="tab" type="button" data-auth-tab="register">Регистрация</button>
        </div>
        <form class="stack-form" id="loginForm">
          <label>
            Email
            <input name="email" type="email" placeholder="mail@example.ru" required>
          </label>
          <label>
            Пароль
            <input name="password" type="password" placeholder="Не короче 6 символов" required>
          </label>
          <div class="hidden" id="tfaRow">
            <label>
              Код двухфакторной аутентификации
              <input name="tfa_code" id="tfaCode" type="text" inputmode="numeric" placeholder="6 цифр из приложения" autocomplete="one-time-code">
            </label>
          </div>
          <button class="button button-primary" id="loginSubmitBtn" type="submit">Войти</button>
          <p class="hint">Демо-вход: client@meblio.ru / client123 или maker@meblio.ru / maker123</p>
          <button class="hint link-button" type="button" id="forgotLink">Забыли пароль?</button>
        </form>
        <form class="stack-form hidden" id="forgotForm">
          <label>
            Email
            <input name="email" type="email" placeholder="mail@example.ru" required>
          </label>
          <button class="button button-primary" type="submit">Выслать ссылку восстановления</button>
          <button class="hint link-button" type="button" id="forgotCancel">← Назад ко входу</button>
        </form>
        <form class="stack-form hidden" id="registerForm">
          <label>
            Роль
            <select name="role" required>
              <option value="client">Заказчик мебели</option>
              <option value="maker">Производитель мебели</option>
            </select>
          </label>
          <label>
            Имя или компания
            <input name="name" type="text" placeholder="Название компании" required>
          </label>
          <label>
            Email
            <input name="email" type="email" placeholder="mail@example.ru" required>
          </label>
          <label>
            Пароль
            <input name="password" type="password" placeholder="Не короче 6 символов" minlength="6" required>
          </label>
          <input name="website" type="text" style="display:none" tabindex="-1" autocomplete="off" aria-hidden="true">
          <label>
            Город
            <input name="city" type="text" placeholder="Москва" required>
          </label>
          <label>
            Регион
            <select name="region_id" id="registerRegion">
              <option value="">Выберите регион</option>
            </select>
          </label>
          <label class="maker-only">
            Тип компании
            <select name="company_type">
              <option value="manufacturer">Производитель</option>
              <option value="designer">Проектировщик</option>
              <option value="serial">Серийное производство</option>
              <option value="supplier">Поставщик</option>
            </select>
          </label>
          <label class="maker-only">
            Компетенции производства
            <input name="skills" type="text" placeholder="Кухни, шкафы, HoReCa, монтаж">
          </label>
          <button class="button button-primary" type="submit">Создать кабинет</button>
        </form>
        <p class="form-result" id="authMessage" aria-live="polite"></p>
      </section>
    </div>

    <script src="script.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
