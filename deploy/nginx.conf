# Nginx reverse proxy for Meblio production.
# Copy to /etc/nginx/sites-available/meblio and enable:
#   sudo ln -s /etc/nginx/sites-available/meblio /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS certificate (Let's Encrypt):
#   sudo certbot --nginx -d meblio.example.com

server {
    listen 443 ssl http2;
    server_name meblio.example.com;

    ssl_certificate     /etc/letsencrypt/live/meblio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meblio/privkey.pem;

    client_max_body_size 30m;   # uploads up to 25 MB + headroom

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSocket (real-time chat)
    location ~ ^/(ws)?$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name meblio.example.com;
    return 301 https://$host$request_uri;
}
