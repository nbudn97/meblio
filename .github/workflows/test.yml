name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: |
          set -o pipefail
          python -m unittest tests -v 2>&1 | tee test_output.txt
      - name: Report failure publicly
        if: failure()
        run: |
          grep -E "^(FAIL|ERROR):|^====|^Traceback|^AssertionError|^ [A-Za-z]*Error" test_output.txt | head -40 | while IFS= read -r line; do
            echo "::error::${line:0:180}"
          done
          echo "::error::py$(python --version)"
